<html>
<head><meta charset="utf-8" /></head>
<body style="background: transparent; margin: 0;">
<div id="plot" style="width:100%; height:100%;"></div>
<script charset="utf-8" src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script>
  const x = [-5, 0, 5];
  Plotly.newPlot("plot", [
    { x: x, y: x.map(v => Math.max(0, v)), mode: "lines", line: { color: "#636efa", width: 3 }, name: "ReLU" }
  ], {
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: "#888" },
    margin: { l: 40, r: 10, t: 10, b: 40 },
    xaxis: { title: "z", gridcolor: "rgba(128,128,128,0.3)", zerolinecolor: "rgba(128,128,128,0.6)" },
    yaxis: { title: "a[z]", gridcolor: "rgba(128,128,128,0.3)", zerolinecolor: "rgba(128,128,128,0.6)" },
    showlegend: false
  }, { displayModeBar: false, responsive: true });
</script>
</body>
</html>
